[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
font = "sans-serif"
baseRadius = "0.6rem"

[theme.sidebar]
backgroundColor = "#0d2847"
textColor = "#e8eef6"
secondaryBackgroundColor = "#163a63"
borderColor = "#1f4a7a"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
